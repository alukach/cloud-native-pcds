[project]
name = "pcds-parquet"
version = "0.1.0"
description = "Cloud-optimized Parquet build of the BC Provincial Climate Data Set (PCDS)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyarrow>=17",
  "duckdb>=1.1",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "rashid>=0.1.8,<0.2.0"]

[project.scripts]
pcds = "pcds.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcds"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned explicitly: ruff's implicit default rule set widens between releases,
# so an unpinned `ruff check` goes from clean to dozens of findings on upgrade.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
