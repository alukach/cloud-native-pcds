# Fold staged deltas into period partitions. Quarterly keeps the hot partition
# from being rewritten more often than it needs to be while still clearing the
# 64 MiB floor every time (~71 MiB of deltas per quarter at current rates).
# Re-run `pcds plan` after a season of real data and adjust this cron.
name: compact

on:
  schedule:
    - cron: "30 15 1 */3 *"
  workflow_dispatch:
    inputs:
      period:
        description: "Comma-separated periods, e.g. 2025,2026. Empty = periods with deltas."
        default: ""

jobs:
  compact:
    uses: ./.github/workflows/_setup.yml
    with:
      command: >-
        pcds compact --period "${{ github.event.inputs.period || '' }}"
      timeout-minutes: 240
      concurrency-group: pcds-write
    secrets: inherit

  catalog:
    needs: compact
    uses: ./.github/workflows/_setup.yml
    with:
      command: pcds catalog
      timeout-minutes: 30
      concurrency-group: pcds-write
    secrets: inherit


  portolan:
    needs: catalog
    uses: ./.github/workflows/_setup.yml
    with:
      command: >-
        pcds portolan
        --base-url "${{ vars.PCDS_BASE_URL }}"
        --s3-uri "${{ vars.PCDS_PUBLIC_S3_URI }}"
      timeout-minutes: 30
    secrets: inherit

  verify:
    needs: portolan
    uses: ./.github/workflows/_setup.yml
    with:
      command: pcds verify
      timeout-minutes: 30
      concurrency-group: pcds-verify
    secrets: inherit

  # rashid was already a dev dep but only ever ran in pytest over a synthetic
  # catalog; nothing had validated the real one. Needs a script because rashid
  # wants a local tree and _setup.yml takes a single command.
  conformance:
    needs: portolan
    uses: ./.github/workflows/_setup.yml
    with:
      command: bash scripts/conformance.sh
      timeout-minutes: 30
      concurrency-group: pcds-verify
    secrets: inherit
